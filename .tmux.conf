# Enable mouse support for selecting/resizing panes, scrolling, etc.
setw -g mouse on

# Vim-style key bindings for navigating between panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Set terminal to support 256 colors for proper color rendering
set -g default-terminal "screen-256color"